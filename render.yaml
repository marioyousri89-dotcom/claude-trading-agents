# Render Blueprint: deploys the whole ATS Matrix system (paper mode) as one
# always-on web service, rebuilt automatically on every merge to main.
# Render generates DASHBOARD_PASSWORD; find it under the service's Environment tab.
services:
  - type: web
    name: ats-matrix
    runtime: docker
    plan: starter
    branch: main
    autoDeploy: true
    dockerCommand: python -m trading.cloud
    healthCheckPath: /health
    envVars:
      - key: DASHBOARD_PASSWORD
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: EVENTS_DIR
        value: /events
      # JARVIS: set these in the Render dashboard (Environment tab). They are never in the repo.
      - key: JARVIS_PASSPHRASE   # at least 8 characters; JARVIS stays off on the internet without it
        sync: false
      - key: ANTHROPIC_API_KEY   # optional: gives JARVIS a Claude brain; without it she uses her handbook
        sync: false
