# ATS Matrix V2 (paper mode): 750 agents split across 3 engine containers, the
# 8-bot ring (Polymarket + Crypto Predictor) in its own container, and a
# live-log dashboard with the signal heatmap and Jev decision desk.
#   docker compose up --build          start everything
#   docker compose logs -f             follow live logs from every container
#   open http://127.0.0.1:8080         live dashboard

# Cap Docker's own copy of container output (the default keeps it forever).
x-logging: &logging
  driver: json-file
  options: { max-size: "20m", max-file: "3" }

x-engine: &engine
  logging: *logging
  build:
    context: .
    args:
      PYTHON_VERSION: ${PYTHON_VERSION:-3.13}
  image: claude-trading-agents
  restart: on-failure  # a finished TICKS run exits 0 and stays stopped
  volumes:
    - events:/events
  environment: &engine-env
    AGENT_COUNT: ${AGENT_COUNT:-750}
    SHARD_COUNT: 3
    TICK_SECONDS: ${TICK_SECONDS:-0.5}
    TICKS: ${TICKS:-0}
    LEARNING_INTERVAL_SECONDS: ${LEARNING_INTERVAL_SECONDS:-}

services:
  engine-0:
    <<: *engine
    environment: { <<: *engine-env, SHARD_ID: 0 }
  engine-1:
    <<: *engine
    environment: { <<: *engine-env, SHARD_ID: 1 }
  engine-2:
    <<: *engine
    environment: { <<: *engine-env, SHARD_ID: 2 }

  ring:
    image: claude-trading-agents
    logging: *logging
    depends_on: [engine-0]
    command: ["python", "-m", "trading.ring"]
    restart: on-failure
    volumes:
      - events:/events
    environment:
      TICK_SECONDS: ${RING_TICK_SECONDS:-1.0}
      TICKS: ${TICKS:-0}
      LEARNING_INTERVAL_SECONDS: ${LEARNING_INTERVAL_SECONDS:-}

  dashboard:
    image: claude-trading-agents
    logging: *logging
    depends_on: [engine-0]
    command: ["python", "-m", "trading.dashboard"]
    restart: unless-stopped
    environment:
      DASHBOARD_HOST: 0.0.0.0
      DASHBOARD_AUTH: "off"  # safe only because the port is bound to localhost below
    volumes:
      - events:/events:ro
    ports:
      - "127.0.0.1:8080:8080"  # localhost only: the dashboard has no login
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  events:
