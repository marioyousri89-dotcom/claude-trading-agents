# Render Blueprint: deploys the whole ATS Matrix system (paper mode) as one
# always-on web service, rebuilt automatically on every merge to main.
# Render generates DASHBOARD_PASSWORD; find it under the service's Environment tab.
services:
  - type: web
    name: ats-matrix
    runtime: docker
    plan: starter
    branch: main
    autoDeploy: true
    dockerCommand: python -m trading.cloud
    healthCheckPath: /health
    # A permanent disk for /events: the agents' memory (what they learned), JARVIS's passphrase and the live
    # logs survive every update and restart. About $0.25 a month for 1 GB.
    disk:
      name: events
      mountPath: /events
      sizeGB: 1
    envVars:
      - key: DASHBOARD_PASSWORD
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: EVENTS_DIR
        value: /events
      # Paper trading on live prices (Coinbase, Yahoo). Orders still go to the paper broker; real money stays
      # locked. Set to "sim" to go back to the simulated practice market.
      - key: MARKET
        value: live
      # JARVIS: set these in the Render dashboard (Environment tab). They are never in the repo.
      - key: JARVIS_PASSPHRASE   # optional fixed passphrase; otherwise you choose it on first visit to /jarvis
        sync: false
      - key: ANTHROPIC_API_KEY   # optional: gives JARVIS and the reading room (news + chart reads) a Claude brain
        sync: false
